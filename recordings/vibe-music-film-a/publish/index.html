<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibe-music · Film A — NL → pads</title>
<style>
  :root{--bg:#141210;--ink:#F2EDE4;--mute:#8A8178;--led:#FFB000;--line:#2E2924}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:28px clamp(16px,4vw,40px);max-width:880px;margin-inline:auto}
  h1{font-size:1.45rem;letter-spacing:-.02em;margin:0 0 8px}
  .tag{color:var(--mute);font-size:13px;margin-bottom:22px}
  .story{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;line-height:1.5;font-size:14px}
  video,img{width:100%;border-radius:12px;border:1px solid var(--line);background:#0A0908;display:block}
  .row{display:grid;gap:16px;margin:18px 0}
  a{color:var(--led)}
  code{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
  <h1>vibe·music · Film A</h1>
  <p class="tag">Feature Recorder · story A · A-take2 · pure-screen production demo · no post</p>
  <div class="story" id="story">Loading story…</div>
  <div class="row">
    <div>
      <p class="tag">8s GIF</p>
      <img src="./demo.gif" alt="vibe-music demo GIF" />
    </div>
    <div>
      <p class="tag">Full MP4</p>
      <video src="./demo.mp4" controls playsinline poster="./poster.jpg"></video>
    </div>
  </div>
  <p class="tag">Artifacts: <a href="./handoff.json">handoff.json</a> · <a href="./shotlist.json">shotlist.json</a> · <a href="https://vibe-web-gray.vercel.app/">product</a></p>
<script>
fetch('./handoff.json').then(r=>r.json()).then(h=>{
  document.getElementById('story').textContent = h.user_story || '';
}).catch(()=>{document.getElementById('story').textContent='(handoff pending)'});
</script>
</body>
</html>
